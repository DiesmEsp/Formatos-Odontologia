plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'com.odontologia'
version = '2.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.odontologia.formatos.controller.Main'
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.53.2.1'
    implementation 'org.flywaydb:flyway-core:13.1.0'
    implementation 'org.flywaydb:flyway-database-nc-sqlite:13.1.0'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'io.javalin:javalin:6.5.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

shadowJar {
    archiveClassifier.set('all')
    mergeServiceFiles()
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            excludes = ['com.odontologia.formatos.controller.Main']
            limit {
                counter = 'INSTRUCTION'
                value = 'MISSEDRATIO'
                maximum = 0.95
            }
        }
    }
}

checkstyle {
    toolVersion = '10.21.1'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

task buildJre(type: Exec) {
    description = 'Crea una JRE minima con jlink para distribuir con Electron'
    group = 'distribution'

    def jdkHome = System.getProperty('java.home')
    def jlinkBin = "${jdkHome}/bin/jlink"
    def outputDir = "${layout.buildDirectory.get()}/jre-minimal"

    doFirst {
        file(outputDir).deleteDir()
    }

    commandLine jlinkBin,
        '--output', outputDir,
        '--add-modules', 'java.base,java.sql,java.naming,java.logging,java.management,jdk.unsupported,java.xml',
        '--strip-debug',
        '--compress=zip-6',
        '--no-header-files',
        '--no-man-pages'
}

task prepareElectronResources(type: Copy) {
    description = 'Copia JAR y JRE al directorio de recursos de Electron'
    group = 'distribution'

    dependsOn shadowJar, buildJre

    from shadowJar.archiveFile
    into "${layout.projectDirectory}/frontend/build-resources"

    doLast {
        copy {
            from "${layout.buildDirectory.get()}/jre-minimal"
            into "${layout.projectDirectory}/frontend/build-resources/jre"
        }
    }
}
