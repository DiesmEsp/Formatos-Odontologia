appId: com.odontologia.formatos
productName: Formatos Odontologicos
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: build-resources/jre
    to: jre
  - from: build-resources/FormatosOdontologia-0.1.0-all.jar
    to: backend.jar
  - from: dist
    to: public
asar: false
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
